<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Shaishav Public School</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #1a1a2e; }
    form { display: grid; gap: 15px; margin-bottom: 40px; }
    label { font-weight: 600; color: #333; }
    input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 100%; box-sizing: border-box; }
    button { background-color: #ff6b6b; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #e65555; }
    
    .notice-card { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ccc; }
    .notice-card.accent { border-left-color: #ff6b6b; }
    .notice-card.primary { border-left-color: #ffd700; }
    .notice-card.green { border-left-color: #4CAF50; }
    
    .btn-delete { background-color: #333; padding: 8px 12px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Notice Board Admin</h1>

    <h2 style="font-size: 1.2rem; margin-top: 30px;">Add New Notice</h2>
    <form id="noticeForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Date Number (e.g. 25)</label>
          <input type="text" id="date" required>
        </div>
        <div>
          <label>Month (e.g. MAR)</label>
          <input type="text" id="month" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Badge Label (e.g. NEW, UPDATE)</label>
          <input type="text" id="label" required>
        </div>
        <div>
          <label>Badge Color</label>
          <select id="labelColor">
            <option value="accent">Red (Accent)</option>
            <option value="primary">Yellow (Primary)</option>
            <option value="green">Green</option>
          </select>
        </div>
      </div>

      <div>
        <label>Title</label>
        <input type="text" id="title" required>
      </div>

      <div>
        <label>Description</label>
        <textarea id="description" rows="3" required></textarea>
      </div>

      <button type="submit">Submit Notice</button>
    </form>

    <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">

    <h2 style="font-size: 1.2rem;">Current Notices (Live on Website)</h2>
    <div id="noticeList">Loading...</div>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem('adminPassword');
    if (!adminPassword) {
      adminPassword = prompt("Please enter the Admin Password:");
      if (adminPassword) {
        sessionStorage.setItem('adminPassword', adminPassword);
      } else {
        document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px;color:red;'>Access Denied. Reload to try again.</h2>";
      }
    }

    async function fetchNotices() {
      const resp = await fetch('/api/notices');
      const notices = await resp.json();
      const list = document.getElementById('noticeList');
      list.innerHTML = '';
      
      if(notices.length === 0) list.innerHTML = '<p>No notices currently active.</p>';

      notices.forEach(notice => {
        const div = document.createElement('div');
        div.className = `notice-card ${notice.labelColor}`;
        div.innerHTML = `
          <div>
            <strong>[${notice.label}]</strong> ${notice.title} <br>
            <small style="color:#666;">Date: ${notice.date} ${notice.month}</small>
          </div>
          <button class="btn-delete" onclick="deleteNotice('${notice._id}')">Delete</button>
        `;
        list.appendChild(div);
      });
    }

    async function deleteNotice(id) {
      if(!confirm("Are you sure you want to delete this notice?")) return;
      const res = await fetch(`/api/notices/${id}`, { 
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      });
      if (res.status === 401) {
        alert("Unauthorized: Incorrect admin password.");
        sessionStorage.removeItem('adminPassword');
        location.reload();
      }
      fetchNotices();
    }

    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newNotice = {
        date: document.getElementById('date').value,
        month: document.getElementById('month').value,
        label: document.getElementById('label').value,
        labelColor: document.getElementById('labelColor').value,
        title: document.getElementById('title').value,
        description: document.getElementById('description').value
      };

      const res = await fetch('/api/notices', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'x-admin-password': adminPassword
        },
        body: JSON.stringify(newNotice)
      });

      if (res.status === 401) {
        alert("Unauthorized: Incorrect admin password.");
        sessionStorage.removeItem('adminPassword');
        location.reload();
        return;
      }

      e.target.reset();
      fetchNotices();
    });

    // Load initial notices
    fetchNotices();
  </script>

</body>
</html>
