<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Shaishav Public School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Poppins', 'Inter', sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    
    h1 {
      color: #0f172a;
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0;
    }

    .btn-logout {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-logout:hover {
      background: #dc2626;
      color: #ffffff;
    }
    
    h2 {
      color: #1e293b;
      font-weight: 600;
      margin-top: 30px;
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    form {
      display: grid;
      gap: 18px;
      margin-bottom: 40px;
    }

    label {
      font-weight: 600;
      color: #334155;
      font-size: 0.9rem;
      margin-bottom: 6px;
      display: block;
    }

    input, select, textarea {
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      background: #f8fafc;
      color: #0f172a;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #f26a36;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(242, 106, 54, 0.15);
    }

    select option {
      background: #ffffff;
      color: #1e293b;
    }

    .btn-submit {
      background: linear-gradient(135deg, #f26a36, #fb923c);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(242, 106, 54, 0.35);
      width: 100%;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(242, 106, 54, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    
    .notice-card {
      background: #f8fafc;
      padding: 20px 24px;
      border-radius: 14px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e2e8f0;
      border-left: 5px solid #94a3b8;
      transition: 0.2s ease;
    }
    
    .notice-card:hover {
      transform: translateX(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      background: #ffffff;
    }

    .notice-card.accent { border-left-color: #ef4444; }
    .notice-card.primary { border-left-color: #f59e0b; }
    .notice-card.green { border-left-color: #10b981; }
    
    .notice-card strong {
      color: #0f172a;
      font-size: 1.1rem;
      display: inline-block;
      margin-bottom: 4px;
    }
    
    .notice-card small {
      color: #64748b !important;
      font-size: 0.85rem;
    }
    
    .btn-delete {
      background: #fee2e2;
      color: #dc2626;
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
      border: 1px solid #fca5a5;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-delete:hover {
      background: #dc2626;
      color: #ffffff;
    }
    
    /* Clean White Modal UI (Matching Upload Photo Modal) */
    body.locked { overflow: hidden; }

    #loginOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .login-modal {
      background: #ffffff;
      padding: 35px 35px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
      max-width: 400px;
      width: 90%;
      color: #1e293b;
      position: relative;
    }

    .login-modal h2 {
      margin-top: 0;
      margin-bottom: 25px;
      font-weight: 700;
      font-size: 1.5rem;
      color: #0f172a;
      text-align: left;
    }

    .modal-field {
      margin-bottom: 20px;
      text-align: left;
    }

    .modal-field label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      background: #edf4ff;
      border: 1px solid #dce6f5;
      border-radius: 12px;
      padding: 14px 45px 14px 16px;
      color: #1e293b;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
      outline: none;
      transition: 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #f26a36;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(242, 106, 54, 0.15);
    }

    .input-wrapper i.toggle-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 10;
      padding: 6px;
      user-select: none;
      transition: 0.2s;
    }

    .input-wrapper i.toggle-icon:hover {
      color: #f26a36;
    }

    input::-ms-reveal, input::-ms-clear { display: none; }

    .btn-login {
      background: linear-gradient(135deg, #f26a36, #fb923c);
      border: none;
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 25px;
      font-size: 1.05rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 18px rgba(242, 106, 54, 0.35);
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(242, 106, 54, 0.45);
    }

    #loginError {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 0;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Clean Light Login Overlay (Matches Upload Photo Modal) -->
  <div id="loginOverlay">
    <div class="login-modal">
      <h2>Admin Login</h2>
      
      <div class="modal-field">
        <label>Username</label>
        <div class="input-wrapper">
          <input type="text" value="Admin" readonly style="background:#f1f5f9; cursor:not-allowed;">
        </div>
      </div>
      
      <div class="modal-field">
        <label>Admin Password</label>
        <div class="input-wrapper">
          <input type="password" id="adminPasswordInput" placeholder="Enter password" onkeypress="if(event.key === 'Enter') submitPassword()">
          <i id="togglePasswordIcon" class="fas fa-eye toggle-icon" onclick="togglePasswordVisibility()" title="Show Password"></i>
        </div>
      </div>
      
      <button id="loginBtn" class="btn-login" onclick="submitPassword()">Submit</button>
      <p id="loginError"></p>
    </div>
  </div>

  <!-- Admin Main Dashboard -->
  <div class="container">
    <div class="admin-header">
      <h1>Notice Board Admin</h1>
      <button class="btn-logout" onclick="logoutAdmin()">
        <i class="fas fa-sign-out-alt"></i> Log Out
      </button>
    </div>

    <h2>Add New Notice</h2>
    <form id="noticeForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Date Number (e.g. 25)</label>
          <input type="text" id="date" placeholder="25" required>
        </div>
        <div>
          <label>Month</label>
          <select id="month" required>
            <option value="" disabled selected>Select Month</option>
            <option value="JAN">JAN (January)</option>
            <option value="FEB">FEB (February)</option>
            <option value="MAR">MAR (March)</option>
            <option value="APR">APR (April)</option>
            <option value="MAY">MAY (May)</option>
            <option value="JUN">JUN (June)</option>
            <option value="JUL">JUL (July)</option>
            <option value="AUG">AUG (August)</option>
            <option value="SEP">SEP (September)</option>
            <option value="OCT">OCT (October)</option>
            <option value="NOV">NOV (November)</option>
            <option value="DEC">DEC (December)</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Badge Label (e.g. NEW, UPDATE)</label>
          <input type="text" id="label" placeholder="NEW" required>
        </div>
        <div>
          <label>Badge Color</label>
          <select id="labelColor">
            <option value="accent">Red (Accent)</option>
            <option value="primary">Yellow (Primary)</option>
            <option value="green">Green</option>
          </select>
        </div>
      </div>

      <div>
        <label>Title</label>
        <input type="text" id="title" placeholder="Notice Title" required>
      </div>

      <div>
        <label>Description</label>
        <textarea id="description" rows="3" placeholder="Notice Details..." required></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <i class="fas fa-paper-plane"></i> Submit Notice
      </button>
    </form>

    <h2 style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0;">Current Notices</h2>
    <div id="noticeList">Loading notices...</div>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem('adminPassword');

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('adminPasswordInput');
      const icon = document.getElementById('togglePasswordIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.className = 'fas fa-eye-slash toggle-icon';
        icon.title = 'Hide Password';
      } else {
        pwdInput.type = 'password';
        icon.className = 'fas fa-eye toggle-icon';
        icon.title = 'Show Password';
      }
    }
    
    if (!adminPassword) {
      document.body.classList.add('locked');
    } else {
      document.getElementById('loginOverlay').style.display = 'none';
      document.body.classList.remove('locked');
      fetchNotices();
    }

    async function submitPassword() {
      const pwd = document.getElementById('adminPasswordInput').value;
      if (!pwd) return;
      
      const btn = document.getElementById('loginBtn');
      const errorLabel = document.getElementById('loginError');
      btn.textContent = "VERIFYING...";
      errorLabel.style.display = 'none';

      try {
        const res = await fetch('/api/notices/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        if (!res.ok) {
          throw new Error("Incorrect Password.");
        }

        // Success
        sessionStorage.setItem('adminPassword', pwd);
        adminPassword = pwd;
        document.getElementById('loginOverlay').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loginOverlay').style.display = 'none';
          document.body.classList.remove('locked');
          fetchNotices();
        }, 300);

      } catch (err) {
        btn.textContent = "Submit";
        errorLabel.innerText = "ACCESS DENIED: Incorrect password.";
        errorLabel.style.display = "block";
        document.getElementById('adminPasswordInput').style.borderColor = "#ef4444";
        setTimeout(() => { document.getElementById('adminPasswordInput').style.borderColor = "#dce6f5"; }, 2000);
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('adminPassword');
      location.reload();
    }

    async function fetchNotices() {
      try {
        const resp = await fetch('/api/notices');
        if (!resp.ok) throw new Error("Failed to fetch notices");
        const notices = await resp.json();
        const list = document.getElementById('noticeList');
        list.innerHTML = '';
        
        if(notices.length === 0) list.innerHTML = '<p style="color:#64748b; font-style:italic;">No notices currently active.</p>';

        notices.forEach(notice => {
          const div = document.createElement('div');
          div.className = `notice-card ${notice.labelColor}`;
          div.innerHTML = `
            <div>
              <strong>[${notice.label}] ${notice.title}</strong><br>
              <small>Date: ${notice.date} ${notice.month} | Description: ${notice.description || 'N/A'}</small>
            </div>
            <button class="btn-delete" onclick="deleteNotice('${notice._id}')">Delete</button>
          `;
          list.appendChild(div);
        });
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById('noticeList').innerHTML = `<p style="color:#ef4444">Error loading notices: ${err.message}</p>`;
      }
    }

    async function deleteNotice(id) {
      if(!confirm("Are you sure you want to delete this notice?")) return;
      try {
        const res = await fetch(`/api/notices/${id}`, { 
          method: 'DELETE',
          headers: { 'x-admin-password': adminPassword }
        });
        if (res.status === 401) {
          alert("Unauthorized: Incorrect admin password.");
          sessionStorage.removeItem('adminPassword');
          location.reload();
          return;
        }
        fetchNotices();
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    }

    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const originalBtnHTML = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
      submitBtn.disabled = true;

      try {
        const newNotice = {
          date: document.getElementById('date').value,
          month: document.getElementById('month').value,
          label: document.getElementById('label').value,
          labelColor: document.getElementById('labelColor').value,
          title: document.getElementById('title').value,
          description: document.getElementById('description').value
        };

        const res = await fetch('/api/notices', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-admin-password': adminPassword
          },
          body: JSON.stringify(newNotice)
        });

        if (res.status === 401) {
          alert("Unauthorized: Incorrect admin password. Logging you out.");
          sessionStorage.removeItem('adminPassword');
          location.reload();
          return;
        }
        
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Server returned ${res.status}: ${text}`);
        }

        alert("Notice successfully posted!");
        e.target.reset();
        fetchNotices();
      } catch (err) {
        alert("Failed to submit notice: " + err.message);
      } finally {
        submitBtn.innerHTML = originalBtnHTML;
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
