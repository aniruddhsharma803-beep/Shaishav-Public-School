<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Shaishav Public School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Poppins', 'Inter', sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    
    h1 {
      color: #0f172a;
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0;
    }

    .btn-logout {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-logout:hover {
      background: #dc2626;
      color: #ffffff;
    }
    
    h2 {
      color: #1e293b;
      font-weight: 600;
      margin-top: 30px;
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    form {
      display: grid;
      gap: 18px;
      margin-bottom: 40px;
    }

    label {
      font-weight: 600;
      color: #334155;
      font-size: 0.9rem;
      margin-bottom: 6px;
      display: block;
    }

    input, select, textarea {
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      background: #f8fafc;
      color: #0f172a;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #f26a36;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(242, 106, 54, 0.15);
    }

    select option {
      background: #ffffff;
      color: #1e293b;
    }

    .btn-submit {
      background: linear-gradient(135deg, #f26a36, #fb923c);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(242, 106, 54, 0.35);
      width: 100%;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(242, 106, 54, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    
    .notice-card {
      background: #f8fafc;
      padding: 20px 24px;
      border-radius: 14px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e2e8f0;
      border-left: 5px solid #94a3b8;
      transition: 0.2s ease;
    }
    
    .notice-card:hover {
      transform: translateX(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      background: #ffffff;
    }

    .notice-card.accent { border-left-color: #ef4444; }
    .notice-card.primary { border-left-color: #f59e0b; }
    .notice-card.green { border-left-color: #10b981; }
    
    .notice-card strong {
      color: #0f172a;
      font-size: 1.1rem;
      display: inline-block;
      margin-bottom: 4px;
    }
    
    .notice-card small {
      color: #64748b !important;
      font-size: 0.85rem;
    }
    
    .btn-delete {
      background: #fee2e2;
      color: #dc2626;
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
      border: 1px solid #fca5a5;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-delete:hover {
      background: #dc2626;
      color: #ffffff;
    }

    /* ======== SECTION DIVIDER ======== */
    .section-divider {
      margin: 50px 0 30px;
      padding-top: 30px;
      border-top: 2px solid #e2e8f0;
    }
    .section-divider h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .section-divider p {
      color: #64748b;
      font-size: 0.9rem;
      margin: 0;
    }

    /* ======== GALLERY MANAGEMENT ======== */
    .gallery-admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .gallery-admin-card {
      background: #f8fafc;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      transition: 0.25s ease;
      position: relative;
    }

    .gallery-admin-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .gallery-admin-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .gallery-admin-card .card-body {
      padding: 14px 16px;
    }

    .gallery-admin-card .card-body h4 {
      font-size: 0.95rem;
      color: #0f172a;
      margin: 0 0 4px 0;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gallery-admin-card .card-body p {
      font-size: 0.82rem;
      color: #64748b;
      margin: 0 0 12px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gallery-admin-card .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-edit {
      background: #e0f2fe;
      color: #0284c7;
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid #7dd3fc;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-edit:hover {
      background: #0284c7;
      color: #ffffff;
    }

    .btn-delete-sm {
      background: #fee2e2;
      color: #dc2626;
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid #fca5a5;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-delete-sm:hover {
      background: #dc2626;
      color: #ffffff;
    }

    .gallery-empty {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }

    .gallery-empty i {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
    }

    .gallery-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .gallery-stat-badge {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid #bbf7d0;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #166534;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* ======== UPLOAD FORM ======== */
    .upload-form {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      transition: 0.2s;
    }

    .upload-form:hover {
      border-color: #f26a36;
    }

    .upload-form h3 {
      margin: 0 0 20px 0;
      font-size: 1.1rem;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-input-wrapper {
      position: relative;
      margin-bottom: 15px;
    }

    .file-input-wrapper input[type="file"] {
      padding: 12px;
      background: #ffffff;
    }

    /* ======== EDIT MODAL ======== */
    .edit-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .edit-modal-overlay.active {
      display: flex;
    }

    .edit-modal {
      background: #ffffff;
      padding: 35px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
      max-width: 450px;
      width: 90%;
      position: relative;
    }

    .edit-modal h2 {
      margin: 0 0 25px 0;
      font-size: 1.4rem;
      color: #0f172a;
    }

    .edit-modal .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.3rem;
      color: #94a3b8;
      cursor: pointer;
      transition: 0.2s;
    }

    .edit-modal .modal-close:hover {
      color: #ef4444;
    }

    .edit-modal .modal-field {
      margin-bottom: 18px;
    }

    .edit-modal .modal-field label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      display: block;
    }

    .edit-modal .modal-field input,
    .edit-modal .modal-field textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      font-size: 0.95rem;
      font-family: 'Poppins', sans-serif;
      transition: 0.2s;
    }

    .edit-modal .modal-field input:focus,
    .edit-modal .modal-field textarea:focus {
      border-color: #f26a36;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(242, 106, 54, 0.15);
      outline: none;
    }

    .edit-modal .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-save {
      background: linear-gradient(135deg, #f26a36, #fb923c);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 14px rgba(242, 106, 54, 0.3);
      flex: 1;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(242, 106, 54, 0.4);
    }

    .btn-cancel {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
      padding: 12px 28px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-cancel:hover {
      background: #e2e8f0;
      color: #334155;
    }

    /* Loading spinner */
    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }

    .loading-spinner i {
      font-size: 2rem;
      margin-bottom: 10px;
      display: block;
    }
    
    /* Clean White Modal UI (Matching Upload Photo Modal) */
    body.locked { overflow: hidden; }

    #loginOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .login-modal {
      background: #ffffff;
      padding: 35px 35px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
      max-width: 400px;
      width: 90%;
      color: #1e293b;
      position: relative;
    }

    .login-modal h2 {
      margin-top: 0;
      margin-bottom: 25px;
      font-weight: 700;
      font-size: 1.5rem;
      color: #0f172a;
      text-align: left;
    }

    .modal-field {
      margin-bottom: 20px;
      text-align: left;
    }

    .modal-field label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      background: #edf4ff;
      border: 1px solid #dce6f5;
      border-radius: 12px;
      padding: 14px 45px 14px 16px;
      color: #1e293b;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
      outline: none;
      transition: 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #f26a36;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(242, 106, 54, 0.15);
    }

    .input-wrapper i.toggle-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 10;
      padding: 6px;
      user-select: none;
      transition: 0.2s;
    }

    .input-wrapper i.toggle-icon:hover {
      color: #f26a36;
    }

    input::-ms-reveal, input::-ms-clear { display: none; }

    .btn-login {
      background: linear-gradient(135deg, #f26a36, #fb923c);
      border: none;
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 25px;
      font-size: 1.05rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 18px rgba(242, 106, 54, 0.35);
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(242, 106, 54, 0.45);
    }

    #loginError {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 0;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Clean Light Login Overlay (Matches Upload Photo Modal) -->
  <div id="loginOverlay">
    <div class="login-modal">
      <h2>Admin Login</h2>
      
      <div class="modal-field">
        <label>Username</label>
        <div class="input-wrapper">
          <input type="text" value="Admin" readonly style="background:#f1f5f9; cursor:not-allowed;">
        </div>
      </div>
      
      <div class="modal-field">
        <label>Admin Password</label>
        <div class="input-wrapper">
          <input type="password" id="adminPasswordInput" placeholder="Enter password" onkeypress="if(event.key === 'Enter') submitPassword()">
          <i id="togglePasswordIcon" class="fas fa-eye toggle-icon" onclick="togglePasswordVisibility()" title="Show Password"></i>
        </div>
      </div>
      
      <button id="loginBtn" class="btn-login" onclick="submitPassword()">Submit</button>
      <p id="loginError"></p>
    </div>
  </div>

  <!-- Admin Main Dashboard -->
  <div class="container">
    <div class="admin-header">
      <h1>Notice Board Admin</h1>
      <button class="btn-logout" onclick="logoutAdmin()">
        <i class="fas fa-sign-out-alt"></i> Log Out
      </button>
    </div>

    <h2>Add New Notice</h2>
    <form id="noticeForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Date Number (e.g. 25)</label>
          <input type="text" id="date" placeholder="25" required>
        </div>
        <div>
          <label>Month</label>
          <select id="month" required>
            <option value="" disabled selected>Select Month</option>
            <option value="JAN">JAN (January)</option>
            <option value="FEB">FEB (February)</option>
            <option value="MAR">MAR (March)</option>
            <option value="APR">APR (April)</option>
            <option value="MAY">MAY (May)</option>
            <option value="JUN">JUN (June)</option>
            <option value="JUL">JUL (July)</option>
            <option value="AUG">AUG (August)</option>
            <option value="SEP">SEP (September)</option>
            <option value="OCT">OCT (October)</option>
            <option value="NOV">NOV (November)</option>
            <option value="DEC">DEC (December)</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Badge Label (e.g. NEW, UPDATE)</label>
          <input type="text" id="label" placeholder="NEW" required>
        </div>
        <div>
          <label>Badge Color</label>
          <select id="labelColor">
            <option value="accent">Red (Accent)</option>
            <option value="primary">Yellow (Primary)</option>
            <option value="green">Green</option>
          </select>
        </div>
      </div>

      <div>
        <label>Title</label>
        <input type="text" id="title" placeholder="Notice Title" required>
      </div>

      <div>
        <label>Description</label>
        <textarea id="description" rows="3" placeholder="Notice Details..." required></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <i class="fas fa-paper-plane"></i> Submit Notice
      </button>
    </form>

    <h2 style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0;">Current Notices</h2>
    <div id="noticeList">Loading notices...</div>

    <!-- ======== GALLERY MANAGEMENT SECTION ======== -->
    <div class="section-divider">
      <h1><i class="fas fa-images" style="color: #f26a36;"></i> Gallery Management</h1>
      <p>Upload, edit, and delete gallery photos</p>
    </div>

    <!-- Upload Photo Form -->
    <div class="upload-form">
      <h3><i class="fas fa-cloud-upload-alt" style="color: #f26a36;"></i> Upload New Photo</h3>
      <form id="uploadForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div>
            <label>Photo Title</label>
            <input type="text" id="photoTitle" placeholder="e.g. Annual Day 2026" required>
          </div>
          <div>
            <label>Description (Optional)</label>
            <input type="text" id="photoDesc" placeholder="Brief description...">
          </div>
        </div>
        <div class="file-input-wrapper">
          <label>Select Image</label>
          <input type="file" id="photoFile" accept="image/*" required>
        </div>
        <button type="submit" id="uploadBtn" class="btn-submit">
          <i class="fas fa-upload"></i> Upload Photo
        </button>
      </form>
    </div>

    <!-- Gallery Stats & Grid -->
    <div class="gallery-stats" id="galleryStats"></div>
    <div id="galleryGrid" class="gallery-admin-grid">
      <div class="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i>
        Loading gallery...
      </div>
    </div>
  </div>

  <!-- Edit Photo Modal -->
  <div class="edit-modal-overlay" id="editModalOverlay">
    <div class="edit-modal">
      <button class="modal-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
      <h2><i class="fas fa-edit" style="color: #f26a36;"></i> Edit Photo</h2>
      <div class="modal-field">
        <label>Title</label>
        <input type="text" id="editTitle" placeholder="Photo title">
      </div>
      <div class="modal-field">
        <label>Description</label>
        <textarea id="editDesc" rows="3" placeholder="Photo description..."></textarea>
      </div>
      <input type="hidden" id="editPhotoId">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-save" id="saveEditBtn" onclick="savePhotoEdit()"><i class="fas fa-check"></i> Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem('adminPassword');

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('adminPasswordInput');
      const icon = document.getElementById('togglePasswordIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.className = 'fas fa-eye-slash toggle-icon';
        icon.title = 'Hide Password';
      } else {
        pwdInput.type = 'password';
        icon.className = 'fas fa-eye toggle-icon';
        icon.title = 'Show Password';
      }
    }
    
    if (!adminPassword) {
      document.body.classList.add('locked');
    } else {
      document.getElementById('loginOverlay').style.display = 'none';
      document.body.classList.remove('locked');
      fetchNotices();
      fetchGallery();
    }

    async function submitPassword() {
      const pwd = document.getElementById('adminPasswordInput').value;
      if (!pwd) return;
      
      const btn = document.getElementById('loginBtn');
      const errorLabel = document.getElementById('loginError');
      btn.textContent = "VERIFYING...";
      errorLabel.style.display = 'none';

      try {
        const res = await fetch('/api/notices/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        if (!res.ok) {
          throw new Error("Incorrect Password.");
        }

        // Success
        sessionStorage.setItem('adminPassword', pwd);
        adminPassword = pwd;
        document.getElementById('loginOverlay').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loginOverlay').style.display = 'none';
          document.body.classList.remove('locked');
          fetchNotices();
          fetchGallery();
        }, 300);

      } catch (err) {
        btn.textContent = "Submit";
        errorLabel.innerText = "ACCESS DENIED: Incorrect password.";
        errorLabel.style.display = "block";
        document.getElementById('adminPasswordInput').style.borderColor = "#ef4444";
        setTimeout(() => { document.getElementById('adminPasswordInput').style.borderColor = "#dce6f5"; }, 2000);
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('adminPassword');
      location.reload();
    }

    // ==========================================
    //  NOTICE BOARD FUNCTIONS
    // ==========================================

    async function fetchNotices() {
      try {
        const resp = await fetch('/api/notices');
        if (!resp.ok) throw new Error("Failed to fetch notices");
        const notices = await resp.json();
        const list = document.getElementById('noticeList');
        list.innerHTML = '';
        
        if(notices.length === 0) list.innerHTML = '<p style="color:#64748b; font-style:italic;">No notices currently active.</p>';

        notices.forEach(notice => {
          const div = document.createElement('div');
          div.className = `notice-card ${notice.labelColor}`;
          div.innerHTML = `
            <div>
              <strong>[${notice.label}] ${notice.title}</strong><br>
              <small>Date: ${notice.date} ${notice.month} | Description: ${notice.description || 'N/A'}</small>
            </div>
            <button class="btn-delete" onclick="deleteNotice('${notice._id}')">Delete</button>
          `;
          list.appendChild(div);
        });
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById('noticeList').innerHTML = `<p style="color:#ef4444">Error loading notices: ${err.message}</p>`;
      }
    }

    async function deleteNotice(id) {
      if(!confirm("Are you sure you want to delete this notice?")) return;
      try {
        const res = await fetch(`/api/notices/${id}`, { 
          method: 'DELETE',
          headers: { 'x-admin-password': adminPassword }
        });
        if (res.status === 401) {
          alert("Unauthorized: Incorrect admin password.");
          sessionStorage.removeItem('adminPassword');
          location.reload();
          return;
        }
        fetchNotices();
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    }

    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const originalBtnHTML = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
      submitBtn.disabled = true;

      try {
        const newNotice = {
          date: document.getElementById('date').value,
          month: document.getElementById('month').value,
          label: document.getElementById('label').value,
          labelColor: document.getElementById('labelColor').value,
          title: document.getElementById('title').value,
          description: document.getElementById('description').value
        };

        const res = await fetch('/api/notices', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-admin-password': adminPassword
          },
          body: JSON.stringify(newNotice)
        });

        if (res.status === 401) {
          alert("Unauthorized: Incorrect admin password. Logging you out.");
          sessionStorage.removeItem('adminPassword');
          location.reload();
          return;
        }
        
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Server returned ${res.status}: ${text}`);
        }

        alert("Notice successfully posted!");
        e.target.reset();
        fetchNotices();
      } catch (err) {
        alert("Failed to submit notice: " + err.message);
      } finally {
        submitBtn.innerHTML = originalBtnHTML;
        submitBtn.disabled = false;
      }
    });

    // ==========================================
    //  GALLERY MANAGEMENT FUNCTIONS
    // ==========================================

    async function fetchGallery() {
      const grid = document.getElementById('galleryGrid');
      const statsDiv = document.getElementById('galleryStats');
      grid.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i>Loading gallery...</div>';

      try {
        const resp = await fetch('/api/gallery');
        if (!resp.ok) throw new Error('Failed to fetch gallery');
        const items = await resp.json();
        
        // Stats badge
        statsDiv.innerHTML = `
          <div class="gallery-stat-badge">
            <i class="fas fa-images"></i> ${items.length} Photo${items.length !== 1 ? 's' : ''} in Gallery
          </div>
        `;

        grid.innerHTML = '';

        if (items.length === 0) {
          grid.innerHTML = `
            <div class="gallery-empty" style="grid-column: 1 / -1;">
              <i class="fas fa-camera"></i>
              <p>No photos uploaded yet.<br>Use the form above to add photos.</p>
            </div>
          `;
          return;
        }

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'gallery-admin-card';
          card.innerHTML = `
            <img src="/api/image/${item._id}" alt="${item.title || 'Gallery Photo'}" loading="lazy">
            <div class="card-body">
              <h4>${item.title || 'Untitled'}</h4>
              <p>${item.description || 'No description'}</p>
              <div class="card-actions">
                <button class="btn-edit" onclick="openEditModal('${item._id}', '${(item.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${(item.description || '').replace(/'/g, "\\'").replace(/"/g, '&quot;')}')">
                  <i class="fas fa-pen"></i> Edit
                </button>
                <button class="btn-delete-sm" onclick="deletePhoto('${item._id}')">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error('Gallery fetch error:', err);
        grid.innerHTML = `<p style="color:#ef4444; grid-column: 1/-1;">Error loading gallery: ${err.message}</p>`;
      }
    }

    async function deletePhoto(id) {
      if (!confirm('Are you sure you want to permanently delete this photo? This cannot be undone.')) return;
      
      try {
        const res = await fetch(`/api/image/${id}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminPassword: adminPassword })
        });

        if (res.status === 401) {
          alert('Unauthorized: Incorrect admin password.');
          sessionStorage.removeItem('adminPassword');
          location.reload();
          return;
        }

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || 'Delete failed');
        }

        // Success — refresh gallery
        fetchGallery();
      } catch (err) {
        alert('Failed to delete photo: ' + err.message);
      }
    }

    // ---- Edit Modal ----
    function openEditModal(id, title, desc) {
      document.getElementById('editPhotoId').value = id;
      document.getElementById('editTitle').value = title;
      document.getElementById('editDesc').value = desc;
      document.getElementById('editModalOverlay').classList.add('active');
      document.body.classList.add('locked');
    }

    function closeEditModal() {
      document.getElementById('editModalOverlay').classList.remove('active');
      document.body.classList.remove('locked');
    }

    async function savePhotoEdit() {
      const id = document.getElementById('editPhotoId').value;
      const title = document.getElementById('editTitle').value.trim();
      const description = document.getElementById('editDesc').value.trim();
      const btn = document.getElementById('saveEditBtn');

      if (!title) {
        alert('Title cannot be empty.');
        return;
      }

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/image/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, adminPassword: adminPassword })
        });

        if (res.status === 401) {
          alert('Unauthorized: Incorrect admin password.');
          sessionStorage.removeItem('adminPassword');
          location.reload();
          return;
        }

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || 'Update failed');
        }

        closeEditModal();
        fetchGallery();
      } catch (err) {
        alert('Failed to update photo: ' + err.message);
      } finally {
        btn.innerHTML = '<i class="fas fa-check"></i> Save Changes';
        btn.disabled = false;
      }
    }

    // Close modal on overlay click
    document.getElementById('editModalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('editModalOverlay')) {
        closeEditModal();
      }
    });

    // ---- Upload Photo ----
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('uploadBtn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
      btn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('title', document.getElementById('photoTitle').value);
        formData.append('description', document.getElementById('photoDesc').value);
        formData.append('adminPassword', adminPassword);
        formData.append('mediaFile', document.getElementById('photoFile').files[0]);

        const res = await fetch('/upload', {
          method: 'POST',
          body: formData
        });

        if (res.status === 401) {
          alert('Unauthorized: Incorrect admin password.');
          sessionStorage.removeItem('adminPassword');
          location.reload();
          return;
        }

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || 'Upload failed');
        }

        alert('Photo uploaded successfully!');
        e.target.reset();
        fetchGallery();
      } catch (err) {
        alert('Upload failed: ' + err.message);
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
