<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Shaishav Public School</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
    body { font-family: 'Inter', sans-serif; background: #0b0c10; color: #c5c6c7; margin: 0; padding: 40px 20px; background-image: radial-gradient(circle at top right, #1f2833, #0b0c10); min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; background: rgba(31, 40, 51, 0.4); backdrop-filter: blur(20px); padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(197,198,199,0.1); }
    h1 { text-align: center; color: #66fcf1;text-shadow: 0 0 10px rgba(102,252,241,0.3); font-weight: 800; font-size: 2.5rem; margin-top: 0; margin-bottom: 40px;}
    h2 { color: #c5c6c7; font-weight: 600; border-bottom: 1px solid rgba(197,198,199,0.1); padding-bottom: 15px; margin-top: 40px; margin-bottom: 25px; font-size: 1.4rem;}
    form { display: grid; gap: 20px; margin-bottom: 50px; }
    label { font-weight: 600; color: #45a29e; font-size: 0.95rem; letter-spacing: 0.5px;}
    input, select, textarea { padding: 14px; border: 1px solid rgba(69,162,158,0.3); border-radius: 10px; width: 100%; box-sizing: border-box; background: rgba(11, 12, 16, 0.6); color: #fff; font-family: 'Inter', sans-serif; transition: 0.3s; font-size: 1rem;}
    input:focus, select:focus, textarea:focus { border-color: #66fcf1; box-shadow: 0 0 15px rgba(102,252,241,0.2); outline: none; background: rgba(31, 40, 51, 0.8);}
    select option { background: #0b0c10; color: #fff;}
    button { background: linear-gradient(135deg, #66fcf1, #45a29e); color: #0b0c10; border: none; padding: 16px 24px; border-radius: 10px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; letter-spacing: 1px;}
    button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(102,252,241,0.4); }
    
    .notice-card { background: rgba(31, 40, 51, 0.4); backdrop-filter: blur(10px); padding: 25px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(197,198,199,0.1); border-left: 5px solid #c5c6c7; transition: 0.3s;}
    .notice-card:hover { transform: translateX(5px); background: rgba(31, 40, 51, 0.7); box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-color: rgba(197,198,199,0.3);}
    .notice-card.accent { border-left-color: #ff6b6b; }
    .notice-card.primary { border-left-color: #ffd700; }
    .notice-card.green { border-left-color: #4CAF50; }
    .notice-card strong { color: #fff; font-size: 1.2rem; display: inline-block; margin-bottom: 8px;}
    .notice-card small { color: rgba(197,198,199,0.8) !important; font-size: 0.9rem;}
    
    .btn-delete { background: rgba(255,107,107,0.1); color: #ff6b6b; padding: 10px 18px; font-size: 0.95rem; border-radius: 8px; border: 1px solid rgba(255,107,107,0.3); font-weight: 600;}
    .btn-delete:hover { background: #ff6b6b; color: #fff; box-shadow: 0 5px 15px rgba(255,107,107,0.4); transform: translateY(-2px);}
    
    /* Premium Login Modal */
    body.locked { overflow: hidden; }
    #loginOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(15px);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }
    .login-modal {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px; border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center; max-width: 400px; width: 90%;
      border: 1px solid rgba(255,255,255,0.5);
    }
    .login-modal h2 { margin-top: 0; color: #1a1a2e; margin-bottom: 20px; font-weight: 800; font-size: 1.8rem; }
    .login-modal input {
      font-size: 1rem; padding: 14px; border-radius: 10px; border: 2px solid #e0e6ed; width: 100%; margin-bottom: 24px; outline: none; transition: 0.3s; font-family: 'Inter', sans-serif;
    }
    .login-modal input:focus { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
    .login-modal button {
      background: linear-gradient(135deg, #ffd700, #ffb300); color: #1a1a2e; padding: 14px 24px; border-radius: 10px; font-size: 1.05rem; font-weight: 700; width: 100%; letter-spacing: 0.5px;
    }
    .login-modal button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,215,0,0.4); background-color: #ffd700; }
  </style>
</head>
<body>

  <!-- Premium Login Overlay -->
  <div id="loginOverlay">
    <div class="login-modal">
      <h2><span style="color:#ffb300;">🔒</span> Admin Access</h2>
      <p style="color:#666; margin-bottom: 24px; font-size: 0.95rem;">Enter your secure password to manage the Notice Board.</p>
      <input type="password" id="adminPasswordInput" placeholder="Password..." onkeypress="if(event.key === 'Enter') submitPassword()">
      <button onclick="submitPassword()">Unlock Dashboard</button>
    </div>
  </div>

  <div class="container">
    <h1>Notice Board Admin</h1>

    <h2>Add New Notice</h2>
    <form id="noticeForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Date Number (e.g. 25)</label>
          <input type="text" id="date" required>
        </div>
        <div>
          <label>Month (e.g. MAR)</label>
          <input type="text" id="month" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Badge Label (e.g. NEW, UPDATE)</label>
          <input type="text" id="label" required>
        </div>
        <div>
          <label>Badge Color</label>
          <select id="labelColor">
            <option value="accent">Red (Accent)</option>
            <option value="primary">Yellow (Primary)</option>
            <option value="green">Green</option>
          </select>
        </div>
      </div>

      <div>
        <label>Title</label>
        <input type="text" id="title" required>
      </div>

      <div>
        <label>Description</label>
        <textarea id="description" rows="3" required></textarea>
      </div>

      <button type="submit">Submit Notice</button>
    </form>

    <h2 style="margin-top: 50px;">Current Notices</h2>
    <div id="noticeList">Loading...</div>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem('adminPassword');
    
    if (!adminPassword) {
      document.body.classList.add('locked');
    } else {
      document.getElementById('loginOverlay').style.display = 'none';
      document.body.classList.remove('locked');
      fetchNotices();
    }

    function submitPassword() {
      const pwd = document.getElementById('adminPasswordInput').value;
      if (!pwd) return;
      sessionStorage.setItem('adminPassword', pwd);
      adminPassword = pwd;
      document.getElementById('loginOverlay').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loginOverlay').style.display = 'none';
        document.body.classList.remove('locked');
        fetchNotices();
      }, 400);
    }

    async function fetchNotices() {
      const resp = await fetch('/api/notices');
      const notices = await resp.json();
      const list = document.getElementById('noticeList');
      list.innerHTML = '';
      
      if(notices.length === 0) list.innerHTML = '<p>No notices currently active.</p>';

      notices.forEach(notice => {
        const div = document.createElement('div');
        div.className = `notice-card ${notice.labelColor}`;
        div.innerHTML = `
          <div>
            <strong>[${notice.label}]</strong> ${notice.title} <br>
            <small style="color:#666;">Date: ${notice.date} ${notice.month}</small>
          </div>
          <button class="btn-delete" onclick="deleteNotice('${notice._id}')">Delete</button>
        `;
        list.appendChild(div);
      });
    }

    async function deleteNotice(id) {
      if(!confirm("Are you sure you want to delete this notice?")) return;
      const res = await fetch(`/api/notices/${id}`, { 
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      });
      if (res.status === 401) {
        alert("Unauthorized: Incorrect admin password.");
        sessionStorage.removeItem('adminPassword');
        location.reload();
      }
      fetchNotices();
    }

    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newNotice = {
        date: document.getElementById('date').value,
        month: document.getElementById('month').value,
        label: document.getElementById('label').value,
        labelColor: document.getElementById('labelColor').value,
        title: document.getElementById('title').value,
        description: document.getElementById('description').value
      };

      const res = await fetch('/api/notices', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'x-admin-password': adminPassword
        },
        body: JSON.stringify(newNotice)
      });

      if (res.status === 401) {
        alert("Unauthorized: Incorrect admin password.");
        sessionStorage.removeItem('adminPassword');
        location.reload();
        return;
      }

      e.target.reset();
      fetchNotices();
    });

    // Initial load handled by login sequence
  </script>

</body>
</html>
