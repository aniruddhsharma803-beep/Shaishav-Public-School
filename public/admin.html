<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Shaishav Public School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 40px 20px; min-height: 100vh;
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 99, 132, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(153, 102, 255, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(54, 162, 235, 0.5) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(75, 192, 192, 0.5) 0px, transparent 50%);
    }
    .container { max-width: 800px; margin: 0 auto; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37); border: 1px solid rgba(255,255,255,0.18); }
    h1 { text-align: center; color: #fff; font-weight: 800; font-size: 2.5rem; margin-top: 0; margin-bottom: 40px; letter-spacing: 1px;}
    h1 span.accent { color: #49ffe6; }
    h2 { color: #fff; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-top: 40px; margin-bottom: 25px; font-size: 1.4rem;}
    form { display: grid; gap: 20px; margin-bottom: 50px; }
    label { font-weight: 600; color: rgba(255,255,255,0.9); font-size: 0.95rem; letter-spacing: 0.5px;}
    input, select, textarea { padding: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.1); color: #fff; font-family: 'Inter', sans-serif; transition: 0.3s; font-size: 1rem;}
    input:focus, select:focus, textarea:focus { border-color: #49ffe6; box-shadow: 0 0 15px rgba(73,255,230,0.3); outline: none; background: rgba(255,255,255,0.15);}
    select option { background: #1a1a2e; color: #fff;}
    button { background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 16px 24px; border-radius: 30px; font-weight: 600; font-size: 1.1rem; cursor: pointer; transition: 0.3s; letter-spacing: 1px;}
    button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
    
    .notice-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.18); border-left: 5px solid #c5c6c7; transition: 0.3s;}
    .notice-card:hover { transform: translateX(5px); background: rgba(255, 255, 255, 0.1); box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.3);}
    .notice-card.accent { border-left-color: #ff6b6b; }
    .notice-card.primary { border-left-color: #ffd700; }
    .notice-card.green { border-left-color: #4CAF50; }
    .notice-card strong { color: #fff; font-size: 1.2rem; display: inline-block; margin-bottom: 8px;}
    .notice-card small { color: rgba(197,198,199,0.8) !important; font-size: 0.9rem;}
    
    .btn-delete { background: rgba(255,107,107,0.1); color: #ff6b6b; padding: 10px 18px; font-size: 0.95rem; border-radius: 8px; border: 1px solid rgba(255,107,107,0.3); font-weight: 600;}
    .btn-delete:hover { background: #ff6b6b; color: #fff; box-shadow: 0 5px 15px rgba(255,107,107,0.4); transform: translateY(-2px);}
    
    /* Premium Login Modal */
    body.locked { overflow: hidden; }
    #loginOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background-color: #000;
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 99, 132, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(153, 102, 255, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(54, 162, 235, 0.5) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(75, 192, 192, 0.5) 0px, transparent 50%);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }
    .login-modal {
      background: rgba(255, 255, 255, 0.05);
      padding: 50px 40px; border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-align: center; max-width: 420px; width: 90%;
      color: #fff;
    }
    .login-modal h2 { margin-top: 0; margin-bottom: 40px; font-weight: 800; font-size: 2rem; letter-spacing: 2px; }
    .login-modal h2 span.accent { color: #49ffe6; }
    .input-group { position: relative; margin-bottom: 25px; text-align: left; }
    .input-group i { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 1.2rem; }
    .login-modal input.glass-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px; padding: 18px 50px 18px 20px;
      color: #fff; font-size: 1rem; width: 100%; box-sizing: border-box; outline: none; transition: 0.3s;
    }
    .login-modal input.glass-input::placeholder { color: rgba(255,255,255,0.7); }
    .login-modal input.glass-input:focus { border-color: #49ffe6; background: rgba(255,255,255,0.15); box-shadow: 0 0 15px rgba(73,255,230,0.3); }
    
    .login-modal button.glass-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff; padding: 16px 24px; border-radius: 30px;
      font-size: 1.1rem; font-weight: 600; width: 60%; cursor: pointer; transition: 0.3s; letter-spacing: 1px; margin-top: 10px;
    }
    .login-modal button.glass-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
    
    .login-modal .links { display: flex; justify-content: space-between; margin-top: 30px; font-size: 0.85rem; color: #fff; padding: 0 10px; }
    .login-modal .links span { cursor: pointer; transition: 0.3s; opacity: 0.8; }
    .login-modal .links span:hover { opacity: 1; color: #49ffe6; }
  </style>
</head>
<body>

  <!-- Premium Login Overlay -->
  <div id="loginOverlay">
    <div class="login-modal">
      <h2>ADMIN<span class="accent">PORTAL</span><br><span style="font-size: 1.2rem; font-weight: 400; letter-spacing: 1px;">LOGIN</span></h2>
      
      <div class="input-group">
        <input type="text" class="glass-input" placeholder="Username" value="Admin" readonly>
        <i class="fas fa-user"></i>
      </div>
      
      <div class="input-group">
        <input type="password" id="adminPasswordInput" class="glass-input" placeholder="**********" onkeypress="if(event.key === 'Enter') submitPassword()">
        <i class="fas fa-lock"></i>
      </div>
      
      <button class="glass-btn" onclick="submitPassword()">LOGIN</button>
      
      <div class="links">
        <span>Remember me</span>
        <span>Forgot password?</span>
      </div>
    </div>
  </div>

  <div class="container" style="position: relative;">
    <button onclick="logoutAdmin()" style="position: absolute; top: 20px; right: 20px; background: rgba(255,107,107,0.1); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">
      <i class="fas fa-sign-out-alt"></i> Log Out
    </button>
    <h1>Notice Board Admin</h1>

    <h2>Add New Notice</h2>
    <form id="noticeForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Date Number (e.g. 25)</label>
          <input type="text" id="date" required>
        </div>
        <div>
          <label>Month (e.g. MAR)</label>
          <input type="text" id="month" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Badge Label (e.g. NEW, UPDATE)</label>
          <input type="text" id="label" required>
        </div>
        <div>
          <label>Badge Color</label>
          <select id="labelColor">
            <option value="accent">Red (Accent)</option>
            <option value="primary">Yellow (Primary)</option>
            <option value="green">Green</option>
          </select>
        </div>
      </div>

      <div>
        <label>Title</label>
        <input type="text" id="title" required>
      </div>

      <div>
        <label>Description</label>
        <textarea id="description" rows="3" required></textarea>
      </div>

      <button type="submit">Submit Notice</button>
    </form>

    <h2 style="margin-top: 50px;">Current Notices</h2>
    <div id="noticeList">Loading...</div>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem('adminPassword');
    
    if (!adminPassword) {
      document.body.classList.add('locked');
    } else {
      document.getElementById('loginOverlay').style.display = 'none';
      document.body.classList.remove('locked');
      fetchNotices();
    }

    function submitPassword() {
      const pwd = document.getElementById('adminPasswordInput').value;
      if (!pwd) return;
      sessionStorage.setItem('adminPassword', pwd);
      adminPassword = pwd;
      document.getElementById('loginOverlay').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loginOverlay').style.display = 'none';
        document.body.classList.remove('locked');
        fetchNotices();
      }, 400);
    }

    function logoutAdmin() {
      sessionStorage.removeItem('adminPassword');
      location.reload();
    }

    async function fetchNotices() {
      const resp = await fetch('/api/notices');
      const notices = await resp.json();
      const list = document.getElementById('noticeList');
      list.innerHTML = '';
      
      if(notices.length === 0) list.innerHTML = '<p>No notices currently active.</p>';

      notices.forEach(notice => {
        const div = document.createElement('div');
        div.className = `notice-card ${notice.labelColor}`;
        div.innerHTML = `
          <div>
            <strong>[${notice.label}]</strong> ${notice.title} <br>
            <small style="color:#666;">Date: ${notice.date} ${notice.month}</small>
          </div>
          <button class="btn-delete" onclick="deleteNotice('${notice._id}')">Delete</button>
        `;
        list.appendChild(div);
      });
    }

    async function deleteNotice(id) {
      if(!confirm("Are you sure you want to delete this notice?")) return;
      const res = await fetch(`/api/notices/${id}`, { 
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      });
      if (res.status === 401) {
        alert("Unauthorized: Incorrect admin password.");
        sessionStorage.removeItem('adminPassword');
        location.reload();
      }
      fetchNotices();
    }

    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newNotice = {
        date: document.getElementById('date').value,
        month: document.getElementById('month').value,
        label: document.getElementById('label').value,
        labelColor: document.getElementById('labelColor').value,
        title: document.getElementById('title').value,
        description: document.getElementById('description').value
      };

      const res = await fetch('/api/notices', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'x-admin-password': adminPassword
        },
        body: JSON.stringify(newNotice)
      });

      if (res.status === 401) {
        alert("Unauthorized: Incorrect admin password.");
        sessionStorage.removeItem('adminPassword');
        location.reload();
        return;
      }

      e.target.reset();
      fetchNotices();
    });

    // Initial load handled by login sequence
  </script>

</body>
</html>
